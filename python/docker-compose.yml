version: '3.7'

services:
  redis:
    image: "redis"
    restart: always
    command: redis-server --requirepass 123456
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
  mysql:
    container_name: my-mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_BEFORE_RUNNING
    ports:
      - "3306:3306"
  web:
    build: .
    ports:
     - "8000:8000"
    links:
     - mysql:mysql
     - redis:redis
    depends_on:
     - mysql
    restart: always
    environment:
      - TZ=Asia/Shanghai
  rq:
    build: .
    depends_on:
      - redis
      - web
    command: "rq worker -c rqsettings"
    restart: always
    environment:
      - TZ=Asia/Shanghai
